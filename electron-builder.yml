appId: com.deepseek.dsh-desktop
productName: dsh-desktop
directories:
  buildResources: build
  output: dist/desktop
files:
  - "src/main.mjs"
  - "src/preload.mjs"
  - "package.json"
extraResources:
  # dsh runtime (compat mode) — outside asar so profile node_modules resolution works
  - from: "resources/dsh"
    to: "dsh"
    filter: ["**/*"]
  # dsh icon for window + tray
  - from: "build/icon.png"
    to: "build/icon.png"
# fixed mode bakes cordis.yml inside asar via resources/fixed
asar: true
win:
  target: nsis
  icon: build/icon.ico
  sign: null
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
publish:
  provider: github
  releaseType: draft
